snapshots:
  - name: dim_listing
    relation: ref('silver_listings')
    config:
      schema: gold
      database: RENTALS_DB
      unique_key: listing_id
      strategy: check
      check_cols: ['property_type', 'room_type', 'accommodates', 'bedrooms', 'bathrooms', 'price_per_night']
      dbt_valid_to_current: "to_date('9999-12-31')"
