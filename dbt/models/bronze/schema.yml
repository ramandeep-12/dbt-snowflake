models:
  - name: bookings
    description: "Raw bookings loaded incrementally from the staging source on created_at."
    columns:
      - name: booking_id
        description: "Primary key of a booking."
        data_tests: [unique, not_null]
  - name: listings
    description: "Raw listings JSON loaded incrementally on loaded_at."
    columns:
      - name: raw
        description: "Full listing record as VARIANT."
        data_tests: [not_null]
  - name: hosts
    description: "Raw hosts loaded incrementally from the staging source on created_at."
    columns:
      - name: host_id
        description: "Primary key of a host."
        data_tests: [unique, not_null]
